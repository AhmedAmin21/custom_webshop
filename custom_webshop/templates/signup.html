<form class="form-signin form-signup hide" role="form">
    <div class="page-card-body">
        <div class="form-group">
            <label class="form-label sr-only" for="signup_fullname">{{ _("Full Name") }}</label>
            <input type="text" id="signup_fullname" class="form-control" placeholder="{{ _('Jane Doe') }}"
                required autofocus autocomplete="name">
        </div>
        <div class="form-group">
            <label class="form-label sr-only" for="signup_email">{{ _("Email") }}</label>
            <input type="email" id="signup_email" class="form-control"
                placeholder="{{ _('jane@example.com') }}" required autocomplete="username">
        </div>
        <div class="form-group">
            <label class="form-label sr-only" for="signup_password">{{ _("Password") }}</label>
            <div class="password-field">
                <input type="password" id="signup_password" class="form-control"
                    placeholder="{{ _('Password') }}" required autocomplete="new-password">
                <svg class="field-icon password-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <use class="es-lock" href="#es-line-lock"></use>
                </svg>
                <span toggle="#signup_password" class="toggle-password text-muted">{{ _('Show') }}</span>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label sr-only" for="signup_confirm_password">{{ _("Confirm Password") }}</label>
            <div class="password-field">
                <input type="password" id="signup_confirm_password" class="form-control"
                    placeholder="{{ _('Confirm Password') }}" required autocomplete="new-password">
                <svg class="field-icon password-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <use class="es-lock" href="#es-line-lock"></use>
                </svg>
                <span toggle="#signup_confirm_password" class="toggle-password text-muted">{{ _('Show') }}</span>
            </div>
        </div>
        <div class="form-group">
            <div class="custom-control custom-checkbox">
                <input type="checkbox" class="custom-control-input" id="has_past_transactions">
                <label class="custom-control-label" for="has_past_transactions">
                    {{ _("Have you purchased from CNCLeaders before?") }}
                </label>
            </div>
        </div>
        <div class="form-group" id="mobile_field_group" style="display:none;">
            <label class="form-label sr-only" for="signup_mobile">{{ _("Mobile Number") }}</label>
            <input type="tel" id="signup_mobile" class="form-control"
                placeholder="{{ _('Mobile Number') }}" autocomplete="tel">
        </div>
        <div id="password-strength-message" class="small text-muted mt-2" style="display:none;"></div>
    </div>
    <div class="page-card-actions">
        <button class="btn btn-sm btn-primary btn-block btn-signup"
            type="submit">{{ _("Sign up") }}</button>

        <p class="text-center sign-up-message">
            <a href="#login" class="blue">{{ _("Have an account? Login") }}</a>
        </p>
    </div>
</form>
<script>
(function() {
    var cb = document.getElementById("has_past_transactions");
    var mobileGroup = document.getElementById("mobile_field_group");
    var mobileInput = document.getElementById("signup_mobile");
    if (cb && mobileGroup) {
        cb.addEventListener("change", function() {
            if (this.checked) {
                mobileGroup.style.display = "block";
                if (mobileInput) mobileInput.required = true;
            } else {
                mobileGroup.style.display = "none";
                if (mobileInput) {
                    mobileInput.required = false;
                    mobileInput.value = "";
                }
            }
        });
    }
})();
</script>
