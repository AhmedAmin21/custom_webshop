{% macro nav_link(href, page, label, current_page, i18n_key=None, data_view=None) %}
<li>
    <a href="{{ href }}"
       class="nav-link{% if current_page == page %} active{% endif %}"
       {% if data_view %}data-view="{{ data_view }}"{% endif %}
       {% if i18n_key %}data-i18n="{{ i18n_key }}"{% endif %}>{{ label }}</a>
</li>
{% endmacro %}
