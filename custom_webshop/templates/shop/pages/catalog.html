<section id="catalog-view" class="view-section active">
    <div class="catalog-page-container">
        <aside class="catalog-sidebar">
            <div class="filter-card">
                <h3 class="filter-title" data-i18n="filter_search">Search</h3>
                <div class="search-input-wrapper">
                    <input type="text" id="catalog-search" placeholder="Search by model or spec..." data-i18n-placeholder="filter_search_placeholder" class="search-input">
                    <i data-lucide="search" class="search-icon"></i>
                </div>
            </div>

            <div class="filter-card">
                <h3 class="filter-title" data-i18n="filter_category">Category</h3>
                <div class="filter-options" id="category-filter-list"></div>
            </div>

            <div class="filter-card">
                <h3 class="filter-title" data-i18n="filter_stock">Stock Status</h3>
                <div class="filter-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="filter-instock" checked>
                        <span data-i18n="filter_instock_only">In Stock Only</span>
                    </label>
                </div>
            </div>

            <div class="filter-card">
                <h3 class="filter-title" data-i18n="filter_max_price">Max Price ($)</h3>
                <div class="price-slider-container">
                    <input type="range" id="filter-price-range" min="0" max="2000" step="50" value="2000" class="range-slider">
                    <div class="price-labels">
                        <span>$0</span>
                        <span id="price-slider-value" class="price-slider-val">$2000</span>
                    </div>
                </div>
            </div>

            <div class="filter-card">
                <h3 class="filter-title" data-i18n="filter_brand">Brand</h3>
                <div class="filter-options" id="brand-filter-list"></div>
            </div>

            <button class="btn btn-secondary btn-full" id="clear-filters-btn" data-i18n="btn_reset_filters">Reset Filters</button>
        </aside>

        <div class="catalog-content">
            <div class="catalog-header-bar">
                <div class="results-count" id="results-count-text">Showing 0 components</div>
                <div class="catalog-header-actions" style="display:flex; align-items:center; gap:20px;">
                    <div class="view-toggle-container" id="catalog-view-toggle">
                        <div class="toggle-slider" id="toggle-slider"></div>
                        <button class="toggle-btn active" id="grid-toggle-btn" title="Grid Layout">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
                        </button>
                        <button class="toggle-btn" id="list-toggle-btn" title="List Layout">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg>
                        </button>
                    </div>
                    <div class="sort-selector-wrapper">
                        <label for="sort-select" data-i18n="catalog_sort">Sort: </label>
                        <select id="sort-select" class="sort-select">
                            <option value="default" data-i18n="sort_default">Default Sync Order</option>
                            <option value="price-asc" data-i18n="sort_price_asc">Price: Low to High</option>
                            <option value="price-desc" data-i18n="sort_price_desc">Price: High to Low</option>
                            <option value="alpha" data-i18n="sort_alpha">A-Z Name</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="product-grid" id="catalog-product-grid"></div>
        </div>
    </div>
</section>
