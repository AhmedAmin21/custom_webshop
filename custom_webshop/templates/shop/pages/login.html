<section id="login-view" class="view-section active">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <i data-lucide="lock" class="auth-icon"></i>
                <h2 class="auth-title" data-i18n="auth_login_title">Client Portal</h2>
                <p class="auth-subtitle" data-i18n="auth_login_sub">Secure access to your telemetry dashboard.</p>
            </div>
            <form id="login-form" class="auth-form">
                <div class="input-group">
                    <i data-lucide="mail" class="input-icon"></i>
                    <input type="email" id="login-email" required placeholder="E-mail Address" data-i18n-placeholder="auth_email">
                </div>
                <div class="input-group">
                    <i data-lucide="key" class="input-icon"></i>
                    <input type="password" id="login-password" required placeholder="Password" data-i18n-placeholder="auth_password">
                </div>
                <button type="submit" class="auth-submit-btn">
                    <span data-i18n="auth_login_btn">Authenticate</span>
                    <i data-lucide="arrow-right"></i>
                </button>
            </form>
            <div class="auth-footer">
                <span data-i18n="auth_no_account">No manufacturing account?</span>
                <a href="/shop/signup" class="auth-link" data-i18n="auth_signup_link">Create one</a>
            </div>
        </div>
    </div>
</section>
