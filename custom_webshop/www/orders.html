{% extends "templates/webshop_base.html" %}

{% block page_content %}
<section id="orders-view" class="view-section active">
    <div class="section-container">
        <div class="section-header">
            <h2 class="section-title" data-i18n="orders_title">Purchase & Machining Orders</h2>
            <p class="section-subtitle" data-i18n="orders_subtitle">Real-time telemetry and order dispatch sync with ERPNext</p>
        </div>

        <div class="orders-list-container" id="orders-history-list">
            <!-- Dynamic Orders generated in JS -->
        </div>
    </div>
</section>
{% endblock %}

{% block script %}
<script>
    window.CURRENT_ROUTE = 'orders';
    
    // Inject orders from ERPNext backend
    {% set orders_json = [] %}
    {% for o in orders %}
        {% set _ = orders_json.append({
            "id": o.name,
            "date": o.transaction_date | string,
            "status": "paid" if o.status in ("To Deliver and Bill", "Completed") else "pending",
            "grandTotal": o.grand_total,
            "customer": { "name": "", "address": "", "phone": "" },
            "subtotal": o.grand_total,
            "shipping": 0,
            "items": []
        }) %}
    {% endfor %}
    
    window.INITIAL_ORDERS = {{ frappe.as_json(orders_json) if orders else '[]' }};
</script>
{% endblock %}
