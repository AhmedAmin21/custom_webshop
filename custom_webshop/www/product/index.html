<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNCLeaders | Product Detail</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Cairo:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/custom_webshop/css/shop.css?v={{ build_version }}">

    <script>
        window.FRAPPE_SESSION = {
            user: "{{ session_user }}",
            csrf_token: "{{ csrf_token }}",
            is_guest: {{ 'true' if is_guest else 'false' }}
        };
        window.ITEM_NAME = "{{ item_name | replace('"', '\\"') }}";
        window.PRODUCT_BOOTSTRAP = {{ product_bootstrap | safe }};
    </script>
</head>
<body>

    <div class="top-bar">
        <div class="top-bar-container">
            <div class="top-bar-left">
                <a href="https://www.instagram.com/cncleaderscuttingtools/" class="top-bar-link" target="_blank" rel="noopener" aria-label="Instagram"><i class="fa-brands fa-instagram icon-sm-fa"></i></a>
                <a href="https://www.facebook.com/CncLeaders/" class="top-bar-link" target="_blank" rel="noopener" aria-label="Facebook"><i class="fa-brands fa-facebook-f icon-sm-fa"></i></a>
                <a href="https://wa.me/201283229286" class="top-bar-link" target="_blank" rel="noopener" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp icon-sm-fa"></i></a>
            </div>
            <div class="top-bar-right">
                <a href="mailto:cncleaderssales@gmail.com" class="top-bar-contact"><i data-lucide="mail" class="icon-sm"></i> <span>cncleaderssales@gmail.com</span></a>
                <a href="tel:+201283229286" class="top-bar-contact"><i data-lucide="phone" class="icon-sm"></i> <span>+201283229286</span></a>
            </div>
        </div>
    </div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="/shop" class="logo" dir="ltr"><span class="logo-accent">CNC</span>Leaders</a>
            <ul class="nav-links">
                <li><a href="/shop" class="nav-link" data-i18n="nav_home">Home</a></li>
                <li><a href="/catalog" class="nav-link" data-i18n="nav_catalog">All Products</a></li>
                <li><a href="/orders" class="nav-link" data-i18n="nav_orders">Track Orders</a></li>
            </ul>
            <div class="nav-actions">
                <button class="nav-btn lang-toggle" id="lang-btn" title="Switch Language">
                    <i data-lucide="globe"></i>
                    <span id="lang-btn-text" style="font-size:0.85rem;font-weight:600;margin-left:4px;">AR</span>
                </button>
                <button class="nav-btn theme-toggle" id="theme-btn" style="display:none;">
                    <i data-lucide="sun" class="icon-sun"></i>
                    <i data-lucide="moon" class="icon-moon" style="display:none;"></i>
                </button>
                <button class="nav-btn cart-toggle-btn" id="cart-toggle-btn">
                    <i data-lucide="shopping-cart"></i>
                    <span class="cart-badge" id="cart-badge">0</span>
                </button>
                {% if is_guest %}
                <a href="/login?redirect-to=/catalog" class="nav-btn"><i data-lucide="user"></i></a>
                {% else %}
                <a href="/me" class="nav-btn"><i data-lucide="user"></i></a>
                {% endif %}
                <button class="nav-btn mobile-menu-btn" id="mobile-menu-btn" style="display:none;">
                    <i data-lucide="menu" class="icon-menu"></i>
                    <i data-lucide="x" class="icon-x" style="display:none;"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="main-content" style="padding-top: 80px;">
        <section class="view-section active" style="padding: 24px 0;">
            <!-- Breadcrumb -->
            <div style="max-width:1400px;margin:0 auto;padding:0 24px 16px;">
                <a href="/catalog" style="color:var(--primary-blue);text-decoration:none;font-size:0.9rem;">
                    <i data-lucide="arrow-left" style="width:14px;height:14px;vertical-align:middle;margin-right:4px;"></i>
                    Back to Catalog
                </a>
            </div>

            <!-- Product Detail Container -->
            <div class="detail-container" id="product-detail-container">
                <div style="text-align:center;padding:80px;color:var(--text-muted);" data-i18n="loading">Loading...</div>
            </div>
        </section>
    </main>

    <footer class="app-footer blueprint-footer">
        <div class="footer-grid blueprint-grid">
            <div class="footer-column brand-col">
                <a href="/shop" class="footer-logo blueprint-logo" dir="ltr"><span class="logo-accent">CNC</span>LEADERS</a>
            </div>
        </div>
        <div class="footer-bottom blueprint-bottom">
            <div class="footer-bottom-container"><p class="copyright-text">COPYRIGHT 2026 CNCLEADERS CORP.</p></div>
            <div class="footer-signature">PRECISION ENGINEERED</div>
        </div>
    </footer>

    <!-- Cart Drawer -->
    <div class="cart-drawer-overlay" id="cart-drawer-overlay"></div>
    <div class="cart-drawer" id="cart-drawer">
        <div class="drawer-header">
            <h2 class="drawer-title">Active Cart</h2>
            <button class="close-drawer-btn" id="close-drawer-btn"><i data-lucide="x"></i></button>
        </div>
        <div class="drawer-body" id="cart-drawer-body"></div>
        <div class="drawer-footer">
            <div class="drawer-summary">
                <div class="drawer-summary-row"><span>Est. Total:</span><span id="drawer-subtotal">—</span></div>
            </div>
            <a href="/cart" class="btn btn-primary btn-full center-text" id="drawer-checkout-btn" data-i18n="drawer_proceed">Proceed to Full Form</a>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="/assets/custom_webshop/js/store.js?v={{ build_version }}"></script>
    <script src="/assets/custom_webshop/js/page-product.js?v={{ build_version }}"></script>
</body>
</html>
